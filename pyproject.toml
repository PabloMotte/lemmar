[project]
name = "lemmar"
version = "0.1.0"
description = "Command-line Word game similar to Wordle"
readme = "README.md"
authors = [
    { name = "PabloMotte", email = "PabloMotte+github@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
]

[project.scripts]
lemmar = "lemmar:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
